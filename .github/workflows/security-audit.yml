name: Ijazah dependency security audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/security-audit.yml"

permissions:
  contents: write

concurrency:
  group: ijazah-security-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Generate reproducible dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Apply non-breaking security fixes
        run: |
          set +e
          npm audit fix --no-fund
          fix_status=$?
          echo "npm audit fix exit code: $fix_status (remaining findings will be reported by the final audit step)"
          exit 0
      - name: Install exact locked dependency tree
        run: npm ci --no-audit --no-fund
      - name: Check Expo compatibility
        run: npx expo-doctor
      - name: Verify Android bundle export
        run: npx expo export --platform android
      - name: Commit validated lockfile changes
        run: |
          if [ -f package-lock.json ] && [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+users.noreply.github.com"
            git add package-lock.json
            git commit -m "Apply compatible dependency security fixes"
            git push
          fi
      - name: Audit dependency tree and enforce security gate
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-report.json
          audit_status=$?
          node -e 'const fs=require("fs");let a;try{a=JSON.parse(fs.readFileSync("npm-audit-report.json","utf8"))}catch{console.error("npm audit did not return valid JSON");process.exit(2)};const v=a.metadata?.vulnerabilities||{};console.log("Dependency vulnerability summary:");for(const s of ["info","low","moderate","high","critical"])console.log(`${s}: ${v[s]||0}`);for(const [name,item] of Object.entries(a.vulnerabilities||{}))console.log(`- ${name}: ${item.severity}; direct=${item.isDirect}; fixAvailable=${JSON.stringify(item.fixAvailable)}`);if((v.high||0)>0||(v.critical||0)>0)process.exit(1)'
          summary_status=$?
          echo "npm audit exit code: $audit_status"
          exit "$summary_status"

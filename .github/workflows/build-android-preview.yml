name: Build Ijazah Android Preview

on:
  # Run manually while the Expo free monthly Android-build quota is exhausted.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Type-check application and AI4X API
        run: npx tsc --noEmit

      - name: Export web bundle to verify app routes and TypeScript bundling
        run: npx expo export --platform web

      - name: Link or initialize EAS project
        run: npx eas-cli@latest init --account ijazah-omar --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android preview
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

name: Build Ijazah Android Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Build Android preview
        if: ${{ secrets.EXPO_TOKEN != '' }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Explain missing build credential
        if: ${{ secrets.EXPO_TOKEN == '' }}
        run: |
          echo "::error::EXPO_TOKEN is not configured in GitHub Actions secrets."
          echo "Add EXPO_TOKEN, then rerun this workflow to create the installable Android preview."
          exit 1

name: Tajweed Engine Tests
on:
  push:
    branches: [feature/mushaf-first-tasmee]
    paths:
      - 'engine/**'
      - '.github/workflows/tajweed-engine-tests.yml'
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/tajweed-engine-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install Python dependencies except PyTorch
        run: |
          grep -v '^torch==' requirements.txt > /tmp/engine-requirements.txt
          pip install -r /tmp/engine-requirements.txt
      - name: Install CPU-only PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.7.0'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python files
        run: python -m compileall -q tajweed_engine train.py

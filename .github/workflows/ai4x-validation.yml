name: AI4X validation

on:
  push:
    branches:
      - feature/ai4x-on-tarteel-mushaf
  pull_request:
    branches:
      - main

jobs:
  alignment-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install alignment test dependency
        run: python -m pip install "numpy==2.2.5"
      - name: Run CTC alignment and release-gate tests
        run: python -m unittest discover -s engine/tests -v

  app-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check app and API
        run: npx tsc --noEmit

name: Validate Ijazah Mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Expo doctor
        run: npx expo-doctor
      - name: Verify ten-qiraat registry safety gate
        run: node scripts/verify-riwayah-registry.mjs
      - name: Validate Android bundle
        run: npx expo export --platform android

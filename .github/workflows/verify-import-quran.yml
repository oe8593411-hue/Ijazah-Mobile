name: Verify and import Quran corpus

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quran-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned PostgreSQL client with network retries
        run: npm install --no-save --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 pg@8.16.3
      - name: Download exact Tanzil Uthmani 1.1 source
        run: |
          curl --fail --location --retry 3 \
            --data 'quranType=uthmani&outType=txt-2&agree=true&marks=true&sajdah=true&rub=true&tatweel=true&stanween=false' \
            --output quran-uthmani.txt \
            https://tanzil.net/pub/download/index.php
      - name: Verify checksum and structure
        env:
          QURAN_FILE: quran-uthmani.txt
        run: node scripts/verify-tanzil-source.mjs
      - name: Import only after verification
        env:
          QURAN_FILE: quran-uthmani.txt
          DATABASE_URL: ${{ secrets.IJAZAH_DATABASE_URL }}
        run: node scripts/import-tanzil-quran.mjs
      - name: Export verified corpus for the mobile reader
        env:
          QURAN_FILE: quran-uthmani.txt
          SOURCE_SHA256: bf4f57b968d03f4131c070b1e285da9be0e0a108a21c910e872801ca273312c8
          OUTPUT_FILE: src/quran/verified-corpus.json
        run: node scripts/export-tanzil-json.mjs
      - name: Commit verified corpus snapshot
        run: |
          git config user.name "ijazah-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/quran/verified-corpus.json
          if git diff --cached --quiet; then
            echo "No corpus changes to commit."
          else
            git commit -m "chore: refresh verified Quran corpus [skip ci]"
            git push
          fi
